[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diyplan"
dynamic = ["version"]
description = "JSON model of a woodworking project → validated geometry, cut list and an illustrated assembly PDF"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0"]
keywords = ["woodworking", "diy", "assembly instructions", "cut list", "pdf", "claude skill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/shabalinmax/diy-instructions"
Issues = "https://github.com/shabalinmax/diy-instructions/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
diyplan = "diyplan.__main__:main"

[tool.setuptools]
packages = ["diyplan"]

[tool.setuptools.dynamic]
version = { attr = "diyplan.__version__" }

[tool.setuptools.package-data]
diyplan = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
