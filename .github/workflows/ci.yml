name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Examples must pass check and build
        run: |
          for f in examples/*.json; do
            diyplan check "$f"
            diyplan build "$f" -o "/tmp/$(basename "$f" .json).pdf"
          done
